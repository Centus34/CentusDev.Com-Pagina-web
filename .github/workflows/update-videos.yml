name: Actualizar vídeos

# Cada 6 horas lee los últimos Shorts de youtube.com/@CentusDev y actualiza data/videos.json.
# También se puede lanzar a mano desde la pestaña "Actions" > "Actualizar vídeos" > "Run workflow".
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar datos de YouTube
        run: node scripts/update-videos.mjs

      - name: Guardar cambios
        id: commit
        run: |
          if git diff --quiet -- data/videos.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git commit -m "Actualizar vídeos recientes"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Los push hechos con GITHUB_TOKEN no siempre disparan GitHub Pages: se pide la publicación explícitamente.
      - name: Publicar en GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
